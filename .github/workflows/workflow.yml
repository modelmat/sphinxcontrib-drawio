name: Test and Deploy
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '*'
    tags:
      - '*'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Black
        run: |
          pip install black==25.9.0
          black --check --diff .
  test-extension-linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12']
        drawio-version: ['28.2.5']
    steps:
      - uses: actions/checkout@v5
      - name: Install drawio ${{ matrix.drawio-version }}
        run: |
          wget --no-verbose -O drawio.deb https://github.com/jgraph/drawio-desktop/releases/download/v${{ matrix.drawio-version }}/drawio-amd64-${{ matrix.drawio-version }}.deb
          sudo apt install xvfb ./drawio.deb
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: pip install -r dev-requirements.txt
      - name: Install Package
        run: python -m pip install .
      - name: Run Tests for ${{ matrix.python-version }}
        run: python -m pytest -vv
  test-extension-windows:
    runs-on: windows-2025
    strategy:
      matrix:
        python-version: ["3.12"]
        drawio-version: ["28.2.5"]
    steps:
      - uses: actions/checkout@v5
      - name: Install drawio ${{ matrix.drawio-version }} (zip)
        run: |
          Invoke-WebRequest -Uri "https://github.com/jgraph/drawio-desktop/releases/download/v${{ matrix.drawio-version }}/draw.io-${{ matrix.drawio-version }}-windows.zip" -OutFile "drawio.zip"
          Expand-Archive -Path "drawio.zip" -DestinationPath "$env:USERPROFILE\drawio"
      - name: Add draw.io to PATH
        run: echo "$env:USERPROFILE\drawio" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
        shell: powershell
      - name: Check PATH
        run: Get-Command "draw.io"
        shell: powershell
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: pip install -r dev-requirements.txt
      - name: Install Package
        run: python -m pip install .
      - name: Run Tests for ${{ matrix.python-version }}
        run: python -m pytest -vv
  pypi-release:
    needs: test-extension-linux
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/') && github.repository_owner == 'Modelmat'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt
      - name: Build PyPI Wheel
        run: |
          python setup.py sdist
          python setup.py bdist_wheel
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_token }}
